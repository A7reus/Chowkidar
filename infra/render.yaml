# Free-tier deployment: no persistent disk. Reports use the database backend
# so they survive restarts. Uploads still use /tmp and are ephemeral.
# Production pilot: Supabase Auth is enabled. The URL and keys are dashboard
# secrets (sync: false), not committed values.
services:
  - type: web
    name: chowkidar-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DEMO_MODE
        value: "false"
      - key: DEV_JWT_SECRET
        generateValue: true
      - key: DATA_MODE
        value: fixture
      - key: LLM_MODE
        value: mock
      - key: DATABASE_URL
        sync: false
      # Comma-separated exact origins; include both Netlify and Vercel.
      - key: CORS_ORIGINS
        sync: false
      # Single canonical primary origin; keep this on Netlify, not a list.
      - key: WEB_URL
        sync: false
      - key: LOCAL_STORAGE_DIR
        value: /tmp
      - key: REPORT_STORAGE_DIR
        value: /tmp/reports
      - key: STORAGE_BACKEND
        value: database
      - key: REPORT_STORAGE_BUCKET
        value: chowkidar-reports
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MUTATION_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: UPLOAD_STORAGE_DIR
        value: /tmp/uploads
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini/gemini-3.8-flash
      - key: GEMINI_PRO_MODEL
        value: gemini/gemini-pro-latest
      - key: GROQ_MODEL
        value: groq/openai/gpt-oss-120b
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_KEY
        sync: false
  - type: web
    name: chowkidar-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npx --yes pnpm@12.15.0 install --frozen-lockfile && npx --yes pnpm@12.15.0 --filter @chowkidar/web build && rm -rf apps/web/.next/standalone/apps/web/.next/static && cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chowkidar-api.onrender.com
      - key: NODE_VERSION
        value: "22"
