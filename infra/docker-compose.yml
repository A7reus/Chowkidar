name: chowkidar

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chowkidar-postgres
    environment:
      POSTGRES_USER: chowkidar
      POSTGRES_PASSWORD: chowkidar
      POSTGRES_DB: chowkidar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chowkidar -d chowkidar"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    container_name: chowkidar-neo4j
    environment:
      NEO4J_AUTH: neo4j/chowkidar-dev
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p chowkidar-dev 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: chowkidar-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: chowkidar-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: chowkidar
      GENERIC_TIMEZONE: Asia/Dhaka
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  pgdata:
  neo4jdata:
  ollamadata:
  n8ndata:
