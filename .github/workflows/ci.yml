name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint · types · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chowkidar
          POSTGRES_PASSWORD: chowkidar
          POSTGRES_DB: chowkidar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chowkidar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      AUTH_MODE: dev
      DEMO_MODE: "true"
      DEV_JWT_SECRET: ci-only-secret
      LLM_MODE: mock
      DATA_MODE: fixture
      DATABASE_URL: postgresql+psycopg://chowkidar:chowkidar@localhost:5432/chowkidar
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check app tests
      - name: Type-check
        run: uv run pyright
      - name: Apply database schema
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  web:
    name: Web · lint · types · tests · build
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
