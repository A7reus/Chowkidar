name: Keep hosted API warm

# Render Free spins the API down after ~15 idle minutes, which pauses the
# in-process ingestion scheduler and gives judges a ~50 s cold start.
# Pinging /healthz every 10 minutes keeps the single instance awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            https://chowkidar-api.onrender.com/healthz > /dev/null \
            || echo "::warning::Hosted API health check failed"
